<script>
window.state = { room: null, playerId: "p1", talkNpcId: null, talkNodeId: null };
CATALOG.story = {
  title: "The Setra Game",
  paragraphs: ["a","b","c"],
  cta: "Wake Up",
  intro: {

    image: "/images/npcs/mira.png",
    bgGrass: "/images/backgrounds/lobby.webp",
    bgStanding: "/images/backgrounds/town.webp",
    slides: [
      { text: "The world is Krein. It has turned for five billion years, and for five billion years it has carried the tread of men.", image: "/images/backgrounds/menu.webp", pan: "lr" },

const n = parseInt((location.hash.match(/adv=(\d+)/) || [])[1] || "0", 10);

  if (k++ >= n) return;
